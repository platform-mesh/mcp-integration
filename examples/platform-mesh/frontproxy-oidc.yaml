# Enables OIDC bearer-token authentication on the platform-mesh front proxy
# against the local-setup Keycloak, so MCP clients (Copilot Chat, Claude,
# curl) can authenticate with an Authorization header instead of a client
# certificate:
#
#   kubectl -n platform-mesh-system patch frontproxy frontproxy \
#     --type=merge --patch-file examples/platform-mesh/frontproxy-oidc.yaml
#
# Requires a secret with the CA that signed the Keycloak endpoint's serving
# certificate (the local-setup gateway uses mkcert):
#
#   kubectl -n platform-mesh-system create secret generic mcp-oidc-issuer-ca \
#     --from-file=ca.crt="$(mkcert -CAROOT)/rootCA.pem"
#
# Tokens authenticate as oidc:<email>; RBAC in kcp workspaces must be bound
# to that username. hack/setup-platform-mesh.sh does all of this.
spec:
  auth:
    oidc:
      issuerURL: https://portal.localhost:8443/keycloak/realms/welcome
      clientID: kcp-mcp
      usernameClaim: email
      usernamePrefix: "oidc:"
      caFileRef:
        name: mcp-oidc-issuer-ca
        key: ca.crt
