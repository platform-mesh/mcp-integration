# Impersonation rights for the MCP virtual workspace, applied in every
# workspace whose resources it should reach on a caller's behalf.
#
# The server never holds the caller's credential — the front-proxy consumes
# it — so it acts through impersonation and kcp authorizes each request as
# the caller. This identity must not be given resource permissions of its
# own: everything it can do, it does as somebody else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-virtual-workspace-impersonator
rules:
  - apiGroups: [""]
    resources: ["users", "groups", "serviceaccounts"]
    verbs: ["impersonate"]
  # Extras are authorized as userextras/<key> and UIDs as uids, both in
  # authentication.k8s.io; RBAC has no subresource wildcard, so grant the
  # whole group.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["*"]
    verbs: ["impersonate"]
  # kcp's workspace content authorizer denies every request — including the
  # impersonation authorization checks themselves — unless the requesting
  # identity holds the access verb in the workspace.
  - nonResourceURLs: ["/"]
    verbs: ["access"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-virtual-workspace-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-virtual-workspace-impersonator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: mcp-virtual-workspace
