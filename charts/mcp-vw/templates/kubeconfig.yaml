# Kubeconfig CR — kcp-operator mints mcp-vw's client identity. Used as
# the base credential for impersonated per-workspace calls and the SCAR
# leg to access-vw.
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: mcp-vw-kubeconfig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-vw.labels" . | nindent 4 }}
spec:
  username: mcp-virtual-workspace
  groups:
    - mcp-virtual-workspace
  validity: 8766h # 1 year
  secretRef:
    name: mcp-vw-kubeconfig
  target:
    {{- if .Values.kcp.frontProxy }}
    frontProxyRef:
      name: {{ .Values.kcp.frontProxy }}
    {{- else }}
    rootShardRef:
      name: {{ .Values.kcp.rootShard }}
    {{- end }}
