# Kubeconfig CR — kcp-operator generates a kubeconfig secret for access-vw.
#
# Admin-level on purpose: the init container creates workspaces from the
# root down and installs the APIExport. The server reuses the same
# credential (documented dev shortcut); production should run the server
# with the ServiceAccount kubeconfig init mints into the controllers
# workspace.
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: access-vw-kubeconfig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "access-vw.labels" . | nindent 4 }}
spec:
  username: system:kcp:admin
  groups:
    - system:kcp:admin
  validity: 8766h # 1 year
  secretRef:
    name: access-vw-kubeconfig
  target:
    rootShardRef:
      name: {{ .Values.kcp.rootShard }}
