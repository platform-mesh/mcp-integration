apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-vw
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "access-vw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: access-vw
  template:
    metadata:
      labels:
        {{- include "access-vw.labels" . | nindent 8 }}
    spec:
      initContainers:
        # Bootstraps kcp: creates the controllers workspace (any missing
        # workspace along the path), installs the APIExport, schema, bind
        # RBAC and endpoint slice, and mints the controller ServiceAccount.
        # Idempotent — safe on every pod start.
        - name: init
          image: {{ include "access-vw.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/access-vw-init"]
          args:
            - --kubeconfig=/etc/kcp/admin.kubeconfig
            - --workspace-prefix={{ .Values.workspacePrefix }}
            - --controllers-workspace={{ .Values.controllersWorkspace }}
          volumeMounts:
            - name: kcp-kubeconfig
              mountPath: /etc/kcp
              readOnly: true
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
      containers:
        - name: access-vw
          image: {{ include "access-vw.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            # TLS serving — the front-proxy verifies this cert against
            # the kcp server CA.
            - --secure-port={{ .Values.server.securePort }}
            - --tls-cert-file=/etc/access-vw/tls/tls.crt
            - --tls-private-key-file=/etc/access-vw/tls/tls.key
            # Trust X-Remote-* identity headers only from clients presenting
            # a cert signed by the requestheader client CA (the front-proxy).
            - --requestheader-client-ca-file=/etc/kcp/requestheader-ca/tls.crt
            - --requestheader-allowed-names=kcp-front-proxy
            - --requestheader-username-headers=X-Remote-User
            - --requestheader-group-headers=X-Remote-Group
            - --requestheader-extra-headers-prefix=X-Remote-Extra-
            # Direct callers presenting a client certificate signed by kcp's
            # client CA — this is how mcp-vw authenticates its SCAR calls.
            - --client-ca-file=/etc/kcp/client-ca/tls.crt
            # kcp connection for the RBAC provider informers — retargeted at
            # the controllers workspace where the endpoint slice lives.
            - --kubeconfig=/etc/kcp/admin.kubeconfig
            - --workspace-path={{ .Values.workspacePrefix }}:{{ .Values.controllersWorkspace }}
            - --apiexport-endpointslice={{ .Values.server.apiExportEndpointSlice }}
            # Per-cluster endpoints returned in SCAR responses.
            - --endpoint-base={{ .Values.server.endpointBase }}
          ports:
            - containerPort: {{ .Values.server.securePort }}
              name: https
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.server.securePort }}
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: kcp-kubeconfig
              mountPath: /etc/kcp
              readOnly: true
            - name: serving-cert
              mountPath: /etc/access-vw/tls
              readOnly: true
            - name: requestheader-ca
              mountPath: /etc/kcp/requestheader-ca
              readOnly: true
            - name: client-ca
              mountPath: /etc/kcp/client-ca
              readOnly: true
      volumes:
        - name: kcp-kubeconfig
          secret:
            secretName: access-vw-kubeconfig
            items:
              - key: kubeconfig
                path: admin.kubeconfig
        - name: serving-cert
          secret:
            secretName: access-vw-server
        - name: requestheader-ca
          secret:
            secretName: {{ .Values.kcp.requestHeaderCASecret }}
            items:
              - key: tls.crt
                path: tls.crt
        # kcp's client CA — verifies client certs minted by kcp-operator
        # Kubeconfig CRs (mcp-vw's identity).
        - name: client-ca
          secret:
            secretName: {{ .Values.kcp.clientCASecret }}
            items:
              - key: tls.crt
                path: tls.crt
