{{- if .Values.kcp.createServerCAIssuer }}
# CA Issuer wrapping the kcp-operator-created server CA secret. platform-mesh
# deployments don't ship an Issuer for it (only the CA secret exists), so the
# chart can create one. Disable if the environment already provides it.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.kcp.serverCAIssuer }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "access-vw.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ .Values.kcp.serverCASecret }}
{{- end }}
