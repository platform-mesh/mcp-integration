# Serving certificate, issued from the kcp-operator's server CA so the
# front-proxy can verify it with its existing CA mount.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: access-vw-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "access-vw.labels" . | nindent 4 }}
spec:
  secretName: access-vw-server
  issuerRef:
    name: {{ .Values.kcp.serverCAIssuer }}
    kind: Issuer
  dnsNames:
    - access-vw
    - access-vw.{{ .Release.Namespace }}
    - access-vw.{{ .Release.Namespace }}.svc
    - access-vw.{{ .Release.Namespace }}.svc.cluster.local
  duration: 8766h
  usages:
    - server auth
    - digital signature
    - key encipherment
