apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-vw-server
  namespace: kcp-system
spec:
  secretName: mcp-vw-server
  issuerRef:
    name: root-server-ca
    kind: Issuer
  dnsNames:
    - mcp-vw
    - mcp-vw.kcp-system
    - mcp-vw.kcp-system.svc
    - mcp-vw.kcp-system.svc.cluster.local
  duration: 8766h
  usages:
    - server auth
    - digital signature
    - key encipherment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-vw
  namespace: kcp-system
  labels:
    app: mcp-vw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-vw
  template:
    metadata:
      labels:
        app: mcp-vw
    spec:
      containers:
        - name: mcp-vw
          image: ghcr.io/kcp-dev/contrib-mcp-vw:latest
          args:
            - serve
            # TLS serving — the front-proxy verifies this cert against root-ca.
            - --secure-port=9444
            - --tls-cert-file=/etc/mcp-vw/tls/tls.crt
            - --tls-private-key-file=/etc/mcp-vw/tls/tls.key
            # Trust X-Remote-* identity headers only from clients presenting
            # a cert signed by the requestheader client CA (the front-proxy).
            - --requestheader-client-ca-file=/etc/kcp/requestheader-ca/tls.crt
            - --requestheader-allowed-names=kcp-front-proxy
            - --requestheader-username-headers=X-Remote-User
            - --requestheader-group-headers=X-Remote-Group
            - --requestheader-extra-headers-prefix=X-Remote-Extra-
            # SCAR leg: direct to the access-vw Service, impersonating the
            # caller. mcp-vw authenticates with its client cert (kubeconfig);
            # access-vw verifies it against kcp's client CA.
            - --access-url=https://access-vw.kcp-system.svc.cluster.local:9443/services/access
            - --access-ca-file=/etc/kcp/server-ca/tls.crt
            - --access-cache-ttl=30s
            # Own identity: base credential for impersonated per-workspace
            # calls and the SCAR leg above.
            - --kubeconfig=/etc/kcp/kubeconfig
          ports:
            - containerPort: 9444
              name: https
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9444
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: kcp-kubeconfig
              mountPath: /etc/kcp
              readOnly: true
            - name: serving-cert
              mountPath: /etc/mcp-vw/tls
              readOnly: true
            - name: requestheader-ca
              mountPath: /etc/kcp/requestheader-ca
              readOnly: true
            - name: server-ca
              mountPath: /etc/kcp/server-ca
              readOnly: true
      volumes:
        - name: kcp-kubeconfig
          secret:
            secretName: mcp-vw-kubeconfig
        - name: serving-cert
          secret:
            secretName: mcp-vw-server
        - name: requestheader-ca
          secret:
            secretName: root-requestheader-client-ca
            items:
              - key: tls.crt
                path: tls.crt
        # kcp's server CA — verifies access-vw's serving certificate on the
        # direct SCAR leg.
        - name: server-ca
          secret:
            secretName: root-server-ca
            items:
              - key: tls.crt
                path: tls.crt
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-vw
  namespace: kcp-system
  labels:
    app: mcp-vw
spec:
  selector:
    app: mcp-vw
  ports:
    - port: 9444
      targetPort: 9444
      name: https
