# Impersonation rights for mcp-vw, applied in every consumer workspace during
# `make seed`. The server never holds the caller's credential — it acts through
# impersonation and kcp authorizes each request as the caller. This identity
# gets no resource permissions of its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-virtual-workspace-impersonator
rules:
  - apiGroups: [""]
    resources: ["users", "groups", "serviceaccounts", "userextras"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-virtual-workspace-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-virtual-workspace-impersonator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: mcp-virtual-workspace
